<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#0a0a12;font-family:Geist,system-ui,sans-serif;overflow:hidden}
  .wrap{position:relative;width:1200px;height:630px;padding:72px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
  .glow{position:absolute;left:50%;top:-260px;width:900px;height:600px;transform:translateX(-50%);background:rgba(200,162,78,.07);border-radius:50%;filter:blur(120px)}
  .brand{position:relative;display:flex;align-items:center;gap:14px;color:#f5f5fa;font-size:22px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
  h1{position:relative;margin:0;color:#f5f5fa;font-size:64px;line-height:1.1;font-weight:700;letter-spacing:-.02em;max-width:1000px}
  h1 span{color:#c8a24e}
  .foot{position:relative;display:flex;justify-content:space-between;align-items:flex-end;color:#8a8aa0;font-size:22px}
  .line{position:absolute;left:80px;right:80px;bottom:150px;height:1px;background:linear-gradient(90deg,transparent,#c8a24e,transparent);opacity:.35}
</style></head><body>
<div class="wrap">
  <div class="glow"></div>
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="44" stroke="#c8a24e" stroke-width="8"/><circle cx="50" cy="50" r="28" stroke="#c8a24e" stroke-width="6"/><circle cx="50" cy="50" r="10" fill="#c8a24e"/></svg>
    GTM Partner LLC
  </div>
  <h1>GTM Partner LLC.<br>Growth infrastructure for <span>plaintiff law firms.</span></h1>
  <div class="line"></div>
  <div class="foot"><span>gtmpartner.ai</span><span>PlaintiffPilot &nbsp;·&nbsp; MVA Compensation</span></div>
</div>
</body></html>
